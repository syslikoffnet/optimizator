# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin code style
kotlin.code.style=official

# AGP 9 ships built-in Kotlin. Keep the new DSL and built-in Kotlin enabled.
android.builtInKotlin=true
android.newDsl=true

# Dev signing credentials for the committed dev keystore (see signing/dev.keystore).
# Override these with project properties / CI secrets for real releases.
duchamp.dev.storeFile=signing/dev.keystore
duchamp.dev.storePassword=duchamp123
duchamp.dev.keyAlias=duchamp
duchamp.dev.keyPassword=duchamp123
