name: Android CI

on:
  push:
    branches: [ main, arena/e261cba0-optimizator ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.1

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Lint + unit tests + release APK
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RELEASE_STORE_FILE: ${{ secrets.RELEASE_STORE_FILE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew lintDebug testDebugUnitTest assembleRelease --no-daemon --console=plain --stacktrace 2>&1 | tee /tmp/gradle.log

      - name: Upload gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: /tmp/gradle.log
          if-no-files-found: ignore

      - name: Report build failure (annotation)
        if: failure()
        run: |
          {
            echo "::error::=== FAILURE: test method failures ==="
            grep -A 6 -E "[A-Za-z].* > .* FAILED|AssertionFailedError|ComparisonFailure|expected:<|but was:<" /tmp/gradle.log | tail -n 120 | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
            echo "::error::=== FAILURE: compile errors ==="
            grep -A 6 -E "^e: file|UNRESOLVED_REFERENCE|SMARTCAST|ARGUMENT_TYPE|RETURN_TYPE|CONST_VAL" /tmp/gradle.log | tail -n 120 | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
            echo "::error::=== FAILURE: what went wrong ==="
            grep -A 6 -E "What went wrong|Caused by|Execution failed for task|BUILD FAILED" /tmp/gradle.log | tail -n 80 | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
          }

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: duchamp-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
